[project]
name = "littera"
version = "0.1.0"
description = "Places a line's transcription on its image: a span and a slanted box for every character and word."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tobias Perschl" }]
keywords = ["handwritten text recognition", "forced alignment", "historical documents", "PAGE-XML"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "torch>=2.6",
    "pyarrow>=18.0",
    "lxml>=5.3",
    "safetensors>=0.8.0",
]

[project.urls]
Repository = "https://github.com/Maelkolb/littera"

[project.scripts]
littera = "littera.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "modal>=1.0",
    "huggingface-hub>=0.26",
    "requests>=2.32",
    "fonttools>=4.55",
    "matplotlib>=3.9",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/littera"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
