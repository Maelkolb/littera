# Line pool v1: licence decision and role per candidate source of the Kurrent VLM staged pool (volume kurrent-raw).
# licence: the string recorded on the staged rows (kurrent-vlm docs/DATA_CARD_v1_5.md).
# open_licence: true only for MIT, CC BY, CC BY-SA, CC0, Public Domain Mark; "per_row" decides each row by row_licences.
# role: train (train, val, test splits), heldout (heldout split only), out (never in the pool).
# baseline: false where the staged page baselines do not map onto the crop (checked on contact sheets).
# markup: littera.text preset for the source's own markup (characters without ink), applied in training through the source column.
open_licences: [MIT, CC BY, CC BY-SA, CC0, Public Domain Mark]

sources:
